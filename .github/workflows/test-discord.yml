
name: Test Discord Notifications

on:
  workflow_dispatch:

jobs:
  test-discord:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send Discord test alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          node - <<'NODE'
          const { sendDiscord } = require('./notifier');

          (async () => {
            const result = await sendDiscord(
              '✅ Pokémon Restock Monitor test successful! Discord notifications are working.'
            );

            if (!result.sent) {
              console.error(result.error || 'Discord notification failed');
              process.exit(1);
            }

            console.log('Discord notification sent successfully.');
          })().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
